; PlatformIO Project Configuration File
;
;   ESP32-S3 WiFi Print Server
;   Board: ESP32-S3-N16R8 (16MB Flash / 8MB PSRAM)
;   Framework: Arduino
;

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino
lib_deps =
    fastled/FastLED

; --- ESP32-S3-N16R8: 16MB QIO flash, 8MB OPI PSRAM ---
board_build.partitions = default_16MB.csv
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB

; Initial upload over the serial port
upload_protocol = esptool
upload_speed = 460800

; Monitor
monitor_speed = 460800
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

; --- Build Flags ---
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM

; Use this environment after the first serial upload and WiFi setup.
[env:esp32-s3-ota]
extends = env:esp32-s3
upload_protocol = espota
upload_port = printserver.local
